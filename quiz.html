<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Bài Kiểm Tra Trắc Nghiệm – ASTRONIXA Academy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mobile.css">
  <style>
    .quiz-wrapper {
      max-width: 780px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .quiz-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .quiz-timer {
      background: var(--primary-dark);
      color: white;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .quiz-timer.warning {
      background: var(--danger);
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .quiz-card {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-xl);
      padding: 32px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }
    .quiz-question-num {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ohana-orange);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }
    .quiz-question-text {
      font-size: 18px;
      font-weight: 800;
      color: var(--gray-900);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .quiz-option {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius);
      margin-bottom: 12px;
      cursor: pointer;
      transition: var(--transition-fast);
      background: var(--gray-50);
    }
    .quiz-option:hover {
      border-color: var(--ohana-orange);
      background: rgba(249,115,22,0.04);
    }
    .quiz-option.selected {
      border-color: var(--ohana-orange);
      background: rgba(249,115,22,0.1);
    }
    .quiz-option-letter {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--primary-dark);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .quiz-option.selected .quiz-option-letter {
      background: var(--gradient-ohana);
    }
    .quiz-option-text {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--gray-800);
      line-height: 1.4;
    }

    .quiz-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .quiz-nav-dots {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .quiz-nav-dot {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--gray-300);
      background: white;
      font-size: 13px;
      font-weight: 700;
      color: var(--gray-600);
      cursor: pointer;
    }
    .quiz-nav-dot.current {
      border-color: var(--ohana-orange);
      background: var(--ohana-orange);
      color: white;
    }
    .quiz-nav-dot.answered {
      border-color: var(--primary);
      background: rgba(30, 58, 138, 0.1);
      color: var(--primary);
    }

    /* Result Card */
    .quiz-result {
      background: white;
      border-radius: var(--radius-xl);
      border: 1px solid var(--gray-200);
      padding: 48px 32px;
      text-align: center;
      box-shadow: var(--shadow-md);
    }
    .result-icon { font-size: 64px; margin-bottom: 16px; }
    .result-score { font-size: 54px; font-weight: 900; line-height: 1; margin-bottom: 12px; }
    .result-score.pass { color: var(--success); }
    .result-score.fail { color: var(--danger); }
    .result-details {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin: 32px 0;
      padding: 20px;
      background: var(--gray-50);
      border-radius: var(--radius);
    }
    .result-detail .val { font-size: 22px; font-weight: 800; color: var(--gray-900); }
    .result-detail .lbl { font-size: 12.5px; color: var(--gray-500); margin-top: 4px; }
  </style>
</head>
<body style="background: var(--gray-100);">

<!-- Header -->
<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <svg class="astronixa-logo-svg" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="astronixaGradQuiz" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00dfd8"/>
            <stop offset="50%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#ec4899"/>
          </linearGradient>
          <filter id="astronixaGlowQuiz" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
        <ellipse cx="22" cy="22" rx="19" ry="7.5" stroke="url(#astronixaGradQuiz)" stroke-width="2.2" transform="rotate(-30 22 22)" opacity="0.95" />
        <circle cx="36" cy="13" r="2.8" fill="#00dfd8" filter="url(#astronixaGlowQuiz)" />
        <path d="M22 6 L12 34 H17 L19.4 27 H24.6 L27 34 H32 L22 6 Z M20.7 22.5 L22 17.5 L23.3 22.5 H20.7 Z" fill="url(#astronixaGradQuiz)" />
      </svg>
      <div class="logo-text">
        <strong>ASTRONIXA <span>ACADEMY</span></strong>
        <small>Kiểm Tra Đánh Giá</small>
      </div>
    </a>
    <div id="quizCourseTitle" style="color: rgba(255,255,255,0.8); font-size: 14px; font-weight: 600;"></div>
    
    <div style="display:flex; align-items:center; gap:12px;">
      <!-- Language Selector -->
      <div class="lang-selector" id="langSelector">
        <button type="button" class="lang-selector-btn" id="langSelectorBtn" onclick="I18n.toggleDropdown(event)" aria-label="Select Language">
          <span class="lang-flag" id="langFlag">🇻🇳</span>
          <span class="lang-text" id="langText">VI</span>
          <span class="lang-arrow">▾</span>
        </button>
        <div class="lang-menu" id="langMenu">
          <button type="button" class="lang-item active" data-lang="vi" onclick="I18n.setLanguage('vi')"><span class="flag">🇻🇳</span> <span class="name">Tiếng Việt</span></button>
          <button type="button" class="lang-item" data-lang="en" onclick="I18n.setLanguage('en')"><span class="flag">🇬🇧</span> <span class="name">English</span></button>
          <button type="button" class="lang-item" data-lang="fr" onclick="I18n.setLanguage('fr')"><span class="flag">🇫🇷</span> <span class="name">Français</span></button>
          <button type="button" class="lang-item" data-lang="zh" onclick="I18n.setLanguage('zh')"><span class="flag">🇨🇳</span> <span class="name">中文</span></button>
          <button type="button" class="lang-item" data-lang="ja" onclick="I18n.setLanguage('ja')"><span class="flag">🇯🇵</span> <span class="name">日本語</span></button>
        </div>
      </div>
      <a href="courses.html" class="btn btn-login btn-sm">Thoát bài thi</a>
    </div>
  </div>
</header>

<div id="quizApp" style="min-height: calc(100vh - 70px); padding: 24px 0;">
  <!-- Rendered by JS -->
</div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script>
(function() {
  if (!Auth.requireLogin()) return;

  const user = Auth.getCurrentUser();
  const params = new URLSearchParams(window.location.search);
  const courseId = params.get('course');
  const isReview = params.get('review') === '1';
  const app = document.getElementById('quizApp');

  if (!courseId) { window.location.href = 'courses.html'; return; }

  const course = CourseDB.getById(courseId);
  if (!course) { window.location.href = 'courses.html'; return; }

  document.getElementById('quizCourseTitle').textContent = `📚 ${course.title}`;
  document.title = `Bài kiểm tra – ${course.title}`;

  const quiz = QuizDB.getByCourse(courseId);
  if (!quiz || !quiz.questions || !quiz.questions.length) {
    app.innerHTML = `
      <div class="quiz-wrapper">
        <div class="empty-state">
          <div class="empty-icon">📝</div>
          <div class="empty-title">Chưa có bài kiểm tra cho khóa học này</div>
          <a href="course-detail.html?id=${courseId}" class="btn btn-primary" style="margin-top:16px;">← Quay lại khóa học</a>
        </div>
      </div>`;
    return;
  }

  const existingResult = ResultDB.getUserCourseResult(user.id, courseId);
  if (isReview && existingResult) {
    showResult(existingResult.score, existingResult.correctCount, quiz.questions.length, existingResult.timeTaken, true);
    return;
  }

  let currentQ = 0;
  let answers = new Array(quiz.questions.length).fill(null);
  let timeLeft = quiz.timeLimit * 60;
  let timerInterval = null;
  let startTime = Date.now();
  let quizSubmitted = false;

  function renderQuiz() {
    const q = quiz.questions[currentQ];
    const letters = ['A', 'B', 'C', 'D'];

    app.innerHTML = `
      <div class="quiz-wrapper">
        <div class="quiz-header">
          <div>
            <div style="font-size: 13px; font-weight: 700; color: var(--gray-500);">
              Câu hỏi ${currentQ + 1} / ${quiz.questions.length}
            </div>
            <div style="font-size: 16px; font-weight: 800; color: var(--gray-900);">${quiz.title}</div>
          </div>
          <div class="quiz-timer" id="quizTimer">
            ⏱ <span id="timerDisplay">--:--</span>
          </div>
        </div>

        <div class="progress-bar" style="height: 8px; margin-bottom: 24px;">
          <div class="progress-fill" style="width: ${((currentQ) / quiz.questions.length) * 100}%"></div>
        </div>

        <div class="quiz-card fade-in-up">
          <div class="quiz-question-num">CÂU HỎI SỐ ${currentQ + 1}</div>
          <div class="quiz-question-text">${q.text}</div>
          <div>
            ${q.options.map((opt, i) => `
              <div class="quiz-option ${answers[currentQ] === i ? 'selected' : ''}" onclick="selectOption(${i})">
                <div class="quiz-option-letter">${letters[i]}</div>
                <div class="quiz-option-text">${opt}</div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="quiz-nav">
          <div class="quiz-nav-dots">
            ${quiz.questions.map((_, i) => `
              <button class="quiz-nav-dot ${answers[i] !== null ? 'answered' : ''} ${i === currentQ ? 'current' : ''}"
                onclick="goToQuestion(${i})" title="Câu ${i + 1}">
                ${i + 1}
              </button>
            `).join('')}
          </div>

          <div style="display:flex; gap:10px;">
            ${currentQ > 0 ? `<button class="btn btn-secondary btn-sm" onclick="goToQuestion(${currentQ - 1})">‹ Câu trước</button>` : ''}
            ${currentQ < quiz.questions.length - 1
              ? `<button class="btn btn-primary btn-sm" onclick="goToQuestion(${currentQ + 1})">Câu tiếp ›</button>`
              : `<button class="btn btn-primary btn-sm" onclick="confirmSubmit()" style="background:var(--success);">✅ Nộp bài thi</button>`}
          </div>
        </div>

        <div style="margin-top: 24px; text-align: center;">
          <button class="btn btn-primary btn-lg" onclick="confirmSubmit()">
            📤 Hoàn thành & Nộp bài (${answers.filter(a => a !== null).length}/${quiz.questions.length} câu)
          </button>
        </div>
      </div>`;

    startTimer();
  }

  window.selectOption = function(idx) {
    if (quizSubmitted) return;
    answers[currentQ] = idx;
    document.querySelectorAll('.quiz-option').forEach((el, i) => {
      el.classList.toggle('selected', i === idx);
    });
    renderQuiz();
  };

  window.goToQuestion = function(idx) {
    currentQ = idx;
    renderQuiz();
  };

  window.confirmSubmit = function() {
    const unanswered = answers.filter(a => a === null).length;
    if (unanswered > 0) {
      if (!confirm(`Bạn còn ${unanswered} câu chưa trả lời. Bạn có chắc muốn nộp bài không?`)) return;
    }
    submitQuiz();
  };

  function submitQuiz() {
    if (quizSubmitted) return;
    quizSubmitted = true;
    clearInterval(timerInterval);

    const timeTaken = Math.floor((Date.now() - startTime) / 1000);
    let correctCount = 0;
    answers.forEach((ans, i) => {
      if (ans === quiz.questions[i].correct) correctCount++;
    });
    const score = Math.round((correctCount / quiz.questions.length) * 100);

    // Save result to LocalStorage
    ResultDB.save({
      userId: user.id,
      courseId: parseInt(courseId),
      quizId: quiz.id,
      score,
      correctCount,
      totalQuestions: quiz.questions.length,
      answers: [...answers],
      timeTaken,
      passed: score >= quiz.passingScore
    });

    showResult(score, correctCount, quiz.questions.length, timeTaken, false);
  }

  function showResult(score, correct, total, timeTaken, fromSave) {
    const passed = score >= quiz.passingScore;
    const mins = Math.floor(timeTaken / 60);
    const secs = timeTaken % 60;

    app.innerHTML = `
      <div class="quiz-wrapper">
        <div class="quiz-result fade-in-up">
          <div class="result-icon">${passed ? '🏆' : '📚'}</div>
          <div class="result-score ${passed ? 'pass' : 'fail'}">${score}%</div>
          <div style="font-size: 20px; font-weight: 800; color: var(--gray-900); margin-bottom: 6px;">
            ${passed ? '🎉 Chúc mừng! Bạn đã hoàn thành xuất sắc!' : '💪 Bạn chưa đạt điểm yêu cầu!'}
          </div>
          <div style="font-size: 14px; color: var(--gray-500);">
            Điểm đạt tiêu chuẩn: <strong>${quiz.passingScore}%</strong> &nbsp;|&nbsp; Khóa học: <strong>${course.title}</strong>
          </div>

          <div class="result-details">
            <div class="result-detail">
              <div class="val" style="color: ${passed ? 'var(--success)' : 'var(--danger)'};">${correct} / ${total}</div>
              <div class="lbl">Số câu đúng</div>
            </div>
            <div class="result-detail">
              <div class="val">${score}%</div>
              <div class="lbl">Điểm số</div>
            </div>
            <div class="result-detail">
              <div class="val">${mins}p ${String(secs).padStart(2, '0')}s</div>
              <div class="lbl">Thời gian làm</div>
            </div>
          </div>

          ${passed ? `
            <div style="margin: 24px 0; padding: 22px; background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); border: 2px solid #fde68a; border-radius: var(--radius-lg); text-align: center; box-shadow: 0 4px 20px rgba(217,119,6,0.12);">
              <div style="font-size: 38px; margin-bottom: 6px;">🎓</div>
              <h3 style="font-size: 19px; font-weight: 900; color: #92400e; margin-bottom: 6px;">CHỨNG NHẬN ĐẠT CHUẨN TỐT NGHIỆP OHANA ACADEMY</h3>
              <p style="font-size: 13.5px; color: #78350f; max-width: 540px; margin: 0 auto 16px; line-height: 1.6;">
                Chúc mừng bạn <strong>${user.name}</strong> đã hoàn thành xuất sắc bài kiểm tra với số điểm <strong>${score}%</strong>. Bạn đã chính thức được cấp Giấy chứng nhận hoàn thành khóa học từ OHANA Group!
              </p>
              <button class="btn btn-primary" onclick="openQuizCertModal(${score})" style="background:linear-gradient(135deg, #d97706, #b45309); font-weight:800; font-size:15px; padding:12px 24px; box-shadow:0 4px 15px rgba(217,119,6,0.35);">
                📜 Xem & In Chứng Chỉ Tốt Nghiệp Của Bạn
              </button>
            </div>
          ` : ''}

          <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:16px;">
            <a href="course-detail.html?id=${courseId}" class="btn btn-secondary">← Xem lại khóa học</a>
            ${!fromSave ? `<button class="btn btn-primary" onclick="window.location.reload()">🔄 Làm lại bài thi</button>` : ''}
            <a href="courses.html" class="btn btn-outline" style="color:var(--gray-800); border-color:var(--gray-300);">📚 Danh sách khóa học</a>
          </div>
        </div>
      </div>`;
  }

  window.openQuizCertModal = function(finalScore) {
    const modal = document.getElementById('quizCertModal');
    const sheet = document.getElementById('quizCertSheet');
    if (!modal || !sheet) return;
    sheet.innerHTML = buildCertificateHtml({
      studentName: user.name.toUpperCase(),
      courseTitle: course.title,
      certTitle: course.certificateTitle || 'CHỨNG NHẬN HOÀN THÀNH KHÓA HỌC',
      instructor: course.instructor,
      score: finalScore || 100,
      date: formatDate(new Date().toISOString()),
      certId: 'OHANA-CERT-' + user.id + '-' + course.id + '-' + Math.random().toString(36).substring(2, 6).toUpperCase()
    });
    modal.classList.add('show');
    document.body.style.overflow = 'hidden';
  };

  window.closeQuizCertModal = function() {
    const modal = document.getElementById('quizCertModal');
    if (modal) {
      modal.classList.remove('show');
      document.body.style.overflow = '';
    }
  };

  function startTimer() {
    clearInterval(timerInterval);
    const display = document.getElementById('timerDisplay');
    const timerEl = document.getElementById('quizTimer');

    function update() {
      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;
      if (display) display.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      if (timerEl && timeLeft <= 60) timerEl.classList.add('warning');
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        submitQuiz();
      }
      timeLeft--;
    }
    update();
    timerInterval = setInterval(update, 1000);
  }

  renderQuiz();
})();
</script>

<!-- ─── Quiz Certificate Modal ────────────────────────────── -->
<div class="cert-modal-overlay" id="quizCertModal">
  <div class="cert-modal-dialog">
    <div class="cert-modal-topbar">
      <h4>🎓 Giấy Chứng Nhận Tốt Nghiệp Chính Thức – OHANA Academy</h4>
      <div class="cert-modal-actions">
        <button class="cert-print-btn" onclick="window.print()">🖨️ In / Lưu PDF</button>
        <button class="cert-close-btn" onclick="closeQuizCertModal()">✕</button>
      </div>
    </div>
    <div class="certificate-sheet" id="quizCertSheet"></div>
  </div>
</div>
</body>
</html>
